spring:
  application:
    name: testpilot-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/testpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
          max-wait: ${REDIS_POOL_MAX_WAIT:1s}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  error:
    include-message: never

testpilot:
  security:
    encryption-key: ${TESTPILOT_ENCRYPTION_KEY:}
    # 首次启动（空库）时创建初始管理员；local/demo/test profile 可留空（演示数据会建号）。
    admin-initial-username: ${ADMIN_INITIAL_USERNAME:}
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
    session-ttl-minutes: ${TESTPILOT_SECURITY_SESSION_TTL_MINUTES:480}
    permission-cache-ttl-seconds: ${TESTPILOT_PERMISSION_CACHE_TTL_SECONDS:300}
    http-status-enforcement: ${TESTPILOT_SECURITY_HTTP_STATUS_ENFORCEMENT:true}
    # 出站地址安全白名单（逗号分隔），生产保持为空以严格拦截 SSRF。
    ssrf-allowed-hosts: ${TESTPILOT_SSRF_ALLOWED_HOSTS:}
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173
  infrastructure:
    redis:
      enabled: ${REDIS_ENABLED:true}
      required: ${REDIS_REQUIRED:false}
      key-prefix: ${REDIS_KEY_PREFIX:testpilot:}
  ai:
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
    task-max-retries: ${AI_TASK_MAX_RETRIES:1}
    task-timeout-minutes: ${AI_TASK_TIMEOUT_MINUTES:15}
    task-timeout-scan-ms: ${AI_TASK_TIMEOUT_SCAN_MS:60000}
  jenkins:
    mode: REAL
    base-url: http://127.0.0.1:9090
    username: ${JENKINS_USERNAME:}
    api-token: ${JENKINS_API_TOKEN:}
    callback-token: ${JENKINS_CALLBACK_TOKEN:}
    callback-strict-signature: ${JENKINS_CALLBACK_STRICT_SIGNATURE:true}
    connect-timeout-ms: ${JENKINS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${JENKINS_READ_TIMEOUT_MS:15000}
    poll-interval-ms: ${JENKINS_POLL_INTERVAL_MS:10000}
    max-wait-minutes: ${JENKINS_MAX_WAIT_MINUTES:30}
