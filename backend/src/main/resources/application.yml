spring:
  application:
    name: testpilot-platform
  datasource:
    url: jdbc:h2:file:./data/testpilot;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never

testpilot:
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173
  jenkins:
    mode: MOCK
    base-url:
    username:
    api-token:
    callback-token: ${JENKINS_CALLBACK_TOKEN:}
