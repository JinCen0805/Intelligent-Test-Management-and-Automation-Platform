spring:
  datasource:
    url: jdbc:h2:mem:testpilot-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      repositories:
        enabled: false

testpilot:
  security:
    http-status-enforcement: false
    encryption-key: test-only-encryption-key
    ssrf-allowed-hosts: localhost,jenkins-onboarding.example.com,jenkins.example.com,jenkins-binding.example.com
  infrastructure:
    redis:
      enabled: false
      required: false
      key-prefix: 'testpilot:test:'
  ai:
    task-timeout-scan-ms: 3600000
  jenkins:
    mode: MOCK
    callback-token: test-callback-token
    callback-strict-signature: false
    poll-interval-ms: 3600000
